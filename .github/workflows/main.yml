name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
          
      - run: npm install
      
      - run: eas init --account apdo35 --non-interactive
      
      - name: Add android package name
        run: |
          npx jq '.expo.android.package = "com.sanitalocation.app"' app.json > app.json.tmp && mv app.json.tmp app.json
      
      - run: eas build -p android --profile preview --non-interactive
